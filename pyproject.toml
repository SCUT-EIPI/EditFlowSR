[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "editflowsr"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "sympy",
    "sympytorch",
    "numexpr",
    "scikit-learn",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["editflowsr*"]
